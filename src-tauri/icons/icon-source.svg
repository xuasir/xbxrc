<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Xbox 主题绿底，圆角保持应用图标观感。 -->
  <rect width="512" height="512" rx="112" fill="#107c10"/>

  <defs>
    <!-- 外圈保留较多齿数，但统一收细线条，避免视觉过重。 -->
    <mask id="gear-ring-mask">
      <rect width="512" height="512" fill="#000"/>
      <g fill="#fff">
        <circle cx="256" cy="256" r="172"/>
        <rect x="244" y="30" width="24" height="72" rx="6"/>
        <rect x="244" y="30" width="24" height="72" rx="6" transform="rotate(30 256 256)"/>
        <rect x="244" y="30" width="24" height="72" rx="6" transform="rotate(60 256 256)"/>
        <rect x="244" y="30" width="24" height="72" rx="6" transform="rotate(90 256 256)"/>
        <rect x="244" y="30" width="24" height="72" rx="6" transform="rotate(120 256 256)"/>
        <rect x="244" y="30" width="24" height="72" rx="6" transform="rotate(150 256 256)"/>
        <rect x="244" y="30" width="24" height="72" rx="6" transform="rotate(180 256 256)"/>
        <rect x="244" y="30" width="24" height="72" rx="6" transform="rotate(210 256 256)"/>
        <rect x="244" y="30" width="24" height="72" rx="6" transform="rotate(240 256 256)"/>
        <rect x="244" y="30" width="24" height="72" rx="6" transform="rotate(270 256 256)"/>
        <rect x="244" y="30" width="24" height="72" rx="6" transform="rotate(300 256 256)"/>
        <rect x="244" y="30" width="24" height="72" rx="6" transform="rotate(330 256 256)"/>
      </g>
      <circle cx="256" cy="256" r="146" fill="#000"/>
    </mask>
  </defs>

  <!-- 白色齿轮环保持纤细，避免压过中心 X。 -->
  <circle cx="256" cy="256" r="196" fill="#fff" mask="url(#gear-ring-mask)"/>

  <!-- 中心 X 使用两条严格过圆心的笔画，与内圈只留极窄绿边。 -->
  <g
    fill="none"
    stroke="#fff"
    stroke-width="42"
    stroke-linecap="round"
  >
    <path d="M178 178 L334 334"/>
    <path d="M334 178 L178 334"/>
  </g>
</svg>
