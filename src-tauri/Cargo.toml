[package]
name = "xbxrc"
version = "0.1.0"
description = "A Tauri App"
authors = [ "you" ]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "xbxrc_lib"
crate-type = [
  "staticlib",
  "cdylib",
  "rlib"
]

[features]
default = ["native-wip"]
native-wip = ["native-media", "native-gamepad"]
native-media = [
  "dep:xbxengine", "dep:xbxengine-protocol", "dep:pollster", "dep:raw-window-handle",
  "dep:wgpu", "dep:wgpu-hal", "dep:objc2", "dep:objc2-foundation", "dep:objc2-app-kit",
  "dep:metal", "dep:libloading", "dep:windows", "tauri/unstable",
]
native-gamepad = ["dep:ohmygamepad-core", "dep:ohmygamepad-sdl3"]

[build-dependencies]
serde_json.workspace = true
tauri-build = { version = "2", features = [] }
sha2.workspace = true

[dependencies]
async-trait.workspace = true

tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"

serde.workspace = true

serde_json.workspace = true

reqwest.workspace = true

rustls.workspace = true

p256.workspace = true

ring.workspace = true

base64.workspace = true

rfd.workspace = true

hmac.workspace = true

sha2.workspace = true

hex-literal.workspace = true

rand_core.workspace = true

uuid.workspace = true

chrono.workspace = true

url.workspace = true

parking_lot.workspace = true

rand.workspace = true

tauri-plugin-shell = "2.3.5"
tauri-plugin-fs = "2.4.5"
tauri-plugin-store = "2.4.2"
tauri-plugin-keepawake = "0.1.1"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

tokio.workspace = true

xbxengine = { path = "../crates/xbxengine/core", optional = true }
xbxengine-protocol = { path = "../crates/xbxengine/protocol", optional = true }
xbox-auth-flow = { path = "../crates/xbox-auth-flow" }
xbox-cloud-catalog-flow = { path = "../crates/xbox-cloud-catalog-flow" }
xbox-streaming = { path = "../crates/xbox-streaming" }
xbox-webapi = { path = "../crates/xbox-webapi" }
ohmygamepad-core = { path = "../crates/ohmygamepad/core", optional = true }
ohmygamepad-protocol = { path = "../crates/ohmygamepad/protocol" }
ohmygamepad-sdl3 = { path = "../crates/ohmygamepad/backends/sdl3", optional = true }

thiserror.workspace = true

log.workspace = true

env_logger.workspace = true

pollster = { version = "0.3.0", optional = true }
raw-window-handle = { version = "0.6.2", optional = true }
wgpu = { version = "28.0.0", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6.4", default-features = false, features = [ "std" ], optional = true }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
  "alloc",
  "NSGeometry",
  "NSString"
], optional = true }
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
  "NSView",
  "NSWindow"
], optional = true }
wgpu-hal = { version = "28.0.0", optional = true }
metal = { version = "0.33.0", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
libloading = { version = "0.8.9", optional = true }
wgpu-hal = { version = "28.0.0", optional = true }
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D_Fxc",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_System_Com",
  "Win32_System_WindowsProgramming",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Threading",
], optional = true }
