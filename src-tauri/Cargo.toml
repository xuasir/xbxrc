[package]
name = "xbxrc"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "xbxrc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
async-trait.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde.workspace = true
serde_json.workspace = true
reqwest.workspace = true
p256.workspace = true
ring.workspace = true
openssl.workspace = true
base64.workspace = true
hmac.workspace = true
sha2.workspace = true
hex-literal.workspace = true
rand_core.workspace = true
uuid.workspace = true
chrono.workspace = true
url.workspace = true
parking_lot.workspace = true
rand.workspace = true
tauri-plugin-shell = "2.3.5"
tauri-plugin-fs = "2.4.5"
tauri-plugin-store = "2.4.2"
tauri-plugin-keepawake = "0.1.1"
tokio.workspace = true
xbxengine = { path = "../crates/xbxengine/core" }
xbxengine-app = { path = "../crates/xbxengine/app" }
xbxengine-protocol = { path = "../crates/xbxengine/protocol" }
xbox-webapi = { path = "../crates/xbox-webapi" }
ohmygamepad-host = { path = "../crates/ohmygamepad/bridge/host" }
ohmygamepad-protocol = { path = "../crates/ohmygamepad/protocol" }
thiserror.workspace = true
log.workspace = true
env_logger.workspace = true
