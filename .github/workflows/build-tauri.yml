name: Build Tauri

on:
  workflow_dispatch:
  push:
    branches:
      - "release/**"

concurrency:
  group: build-tauri-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macos
          - os: windows-latest
            label: windows

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install opus pkg-config

      - name: Verify vendored FFmpeg SDK
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            test -d "third_party/ffmpeg/windows-x64/include"
            test -d "third_party/ffmpeg/windows-x64/lib"
            test -d "third_party/ffmpeg/windows-x64/bin"
          else
            if [[ "$(uname -m)" == "arm64" ]]; then
              test -d "third_party/ffmpeg/macos-arm64/include"
              test -d "third_party/ffmpeg/macos-arm64/lib"
            else
              test -d "third_party/ffmpeg/macos-x64/include"
              test -d "third_party/ffmpeg/macos-x64/lib"
            fi
          fi

      - name: Install LLVM (Windows, bindgen)
        if: runner.os == 'Windows'
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "18.1"

      - name: pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Rust toolchain
        # `uses` 这里必须引用 action 的分支/标签，Rust 版本要放到 `toolchain` 参数里。
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.1
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          # 工作区根在仓库根目录，共享 target/
          shared-key: tauri-${{ matrix.label }}

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build Tauri bundles (macOS dmg)
        if: runner.os == 'macOS'
        run: pnpm tauri:build:dmg
        env:
          CI: true

      - name: Build Tauri bundles (Windows exe)
        if: runner.os == 'Windows'
        run: pnpm tauri:build:nsis
        env:
          CI: true

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xbxrc-${{ matrix.label }}-${{ runner.arch }}
          if-no-files-found: error
          path: |
            target/release/bundle/**/*.dmg
            target/release/bundle/**/*.exe
