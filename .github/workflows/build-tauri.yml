name: Build Tauri

on:
  workflow_dispatch:
  push:
    branches:
      - "release/**"

concurrency:
  group: build-tauri-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macos
          - os: windows-latest
            label: windows

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install opus pkg-config ffmpeg

      - name: Install FFmpeg (Windows, prebuilt)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # 使用 BtbN 预编译包，避免从源码编译 FFmpeg（耗时 40-60 分钟）
          # latest tag 下文件名固定，不含 commit hash
          $url  = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n7.1-latest-win64-gpl-shared-7.1.zip"
          $dest = "${{ runner.temp }}\ffmpeg"
          $zip  = "${{ runner.temp }}\ffmpeg.zip"

          Write-Host "Downloading FFmpeg prebuilt..."
          Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing

          Expand-Archive -Path $zip -DestinationPath $dest -Force

          # 解压后目录名形如 ffmpeg-n7.1-latest-win64-gpl-shared-7.1
          $inner = Get-ChildItem -Path $dest -Directory | Select-Object -First 1
          $ffmpegDir = $inner.FullName
          Write-Host "FFmpeg dir: $ffmpegDir"

          echo "FFMPEG_DIR=$ffmpegDir"                      >> $env:GITHUB_ENV
          echo "FFMPEG_INCLUDE_DIR=$ffmpegDir\include"      >> $env:GITHUB_ENV
          echo "FFMPEG_LIB_DIR=$ffmpegDir\lib"              >> $env:GITHUB_ENV
          echo "$ffmpegDir\bin"                             >> $env:GITHUB_PATH

      - name: Install LLVM (Windows, bindgen)
        if: runner.os == 'Windows'
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "18.1"

      - name: Install OpenSSL (Windows)
        if: runner.os == 'Windows'
        run: choco install openssl --no-progress -y
        shell: pwsh

      # openssl-sys 在 Windows/MSVC 上不能只设 OPENSSL_DIR：默认只搜 <dir>/lib，而 slproweb/Chocolatey
      # 布局把 libssl.lib 放在 lib/VC/x64/MD（或 MT）。不显式设 OPENSSL_LIB_DIR 时会在 expando 之后
      # 因找不到 .lib 而 panic（exit 101）。
      - name: Set OpenSSL paths for MSVC (Windows)
        if: runner.os == 'Windows'
        run: |
          $candidates = @(
            "C:\Program Files\OpenSSL-Win64",
            "C:\Program Files\OpenSSL",
            "C:\OpenSSL-Win64"
          )
          $opensslDir = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $opensslDir) {
            throw "OpenSSL install directory not found after choco install; expected one of: $($candidates -join ', ')"
          }
          $includeDir = Join-Path $opensslDir "include"
          $libCandidates = @(
            (Join-Path $opensslDir "lib\VC\x64\MD"),
            (Join-Path $opensslDir "lib\VC\x64\MT"),
            (Join-Path $opensslDir "lib")
          )
          $libDir = $null
          foreach ($c in $libCandidates) {
            if (-not (Test-Path $c)) { continue }
            $hasSsl = Test-Path (Join-Path $c "libssl.lib")
            $hasCrypto = Test-Path (Join-Path $c "libcrypto.lib")
            if ($hasSsl -or $hasCrypto) { $libDir = $c; break }
          }
          if (-not $libDir) {
            throw "Could not find libssl.lib/libcrypto.lib under: $($libCandidates -join ', ')"
          }
          echo "OPENSSL_DIR=$opensslDir" >> $env:GITHUB_ENV
          echo "OPENSSL_LIB_DIR=$libDir" >> $env:GITHUB_ENV
          echo "OPENSSL_INCLUDE_DIR=$includeDir" >> $env:GITHUB_ENV
          echo "$opensslDir\bin" >> $env:GITHUB_PATH
        shell: pwsh

      - name: pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Rust toolchain
        # `uses` 这里必须引用 action 的分支/标签，Rust 版本要放到 `toolchain` 参数里。
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.1
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          # 工作区根在仓库根目录，共享 target/
          shared-key: tauri-${{ matrix.label }}

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      # 让 cc/cl 在 PATH 中，否则 openssl-sys 编译 expando.c 可能找不到 cl.exe
      - name: Setup MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build Tauri bundles
        run: pnpm tauri build
        env:
          CI: true

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xbxrc-bundles-${{ matrix.label }}
          if-no-files-found: error
          path: target/release/bundle/
