name: Build Native WIP

on:
  workflow_dispatch:
  push:
    branches: [rust]
  pull_request:
    branches: [rust]

concurrency:
  group: build-native-wip-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/desktop-native-build.yml
    with:
      channel: development
  feature-contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, windows-latest]
        feature: [none, native-media, native-gamepad, native-wip]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/native-wip
      CARGO_INCREMENTAL: "0"
      CMAKE_ARGS: -DCMAKE_POLICY_VERSION_MINIMUM=3.5
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target/native-wip
          shared-key: xbxrc-native-wip-${{ matrix.os }}-${{ matrix.feature }}
      - run: pnpm install --frozen-lockfile
      - uses: TheMrMilchmann/setup-msvc-dev@v4
        if: runner.os == 'Windows'
        with:
          arch: x64
      - name: Configure libclang
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "LIBCLANG_PATH=$env:ProgramFiles\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Validate feature compilation
        shell: bash
        run: |
          feature="${{ matrix.feature }}"
          if [[ "$feature" == "none" ]]; then
            cargo check -p xbxrc --no-default-features --locked
          elif [[ "$feature" == "native-gamepad" ]]; then
            cargo check -p xbxrc --no-default-features --features "$feature" --locked
          else
            node scripts/with-ffmpeg-sdk.mjs -- cargo check -p xbxrc --no-default-features --features "$feature" --locked
          fi
