name: Build Tauri

on:
  workflow_dispatch:
  push:
    branches:
      - "release/**"

concurrency:
  group: build-tauri-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macos
          - os: windows-latest
            label: windows

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install opus pkg-config ffmpeg

      - name: Setup vcpkg and install FFmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vcpkgRoot = "${{ runner.temp }}\vcpkg"
          git clone https://github.com/microsoft/vcpkg.git $vcpkgRoot
          & "$vcpkgRoot\bootstrap-vcpkg.bat" -disableMetrics
          & "$vcpkgRoot\vcpkg.exe" install ffmpeg:x64-windows
          echo "VCPKG_ROOT=$vcpkgRoot" >> $env:GITHUB_ENV
          echo "VCPKG_DEFAULT_TRIPLET=x64-windows" >> $env:GITHUB_ENV

      - name: Install LLVM (Windows, bindgen)
        if: runner.os == 'Windows'
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "18.1"

      - name: Install OpenSSL (Windows)
        if: runner.os == 'Windows'
        run: choco install openssl --no-progress -y
        shell: pwsh

      # Chocolatey 的 OpenSSL 预编译包以动态库为主；设置 OPENSSL_STATIC=1 会让 openssl-sys
      # 去找静态库而失败。链接到导入库即可，运行时 DLL 在 OpenSSL 安装目录的 bin 下。
      - name: Set OPENSSL_DIR (Windows)
        if: runner.os == 'Windows'
        run: |
          $candidates = @(
            "C:\Program Files\OpenSSL-Win64",
            "C:\Program Files\OpenSSL",
            "C:\OpenSSL-Win64"
          )
          $opensslDir = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $opensslDir) {
            throw "OpenSSL install directory not found after choco install; expected one of: $($candidates -join ', ')"
          }
          echo "OPENSSL_DIR=$opensslDir" >> $env:GITHUB_ENV
          echo "$opensslDir\bin" >> $env:GITHUB_PATH
        shell: pwsh

      - name: pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Rust toolchain
        # `uses` 这里必须引用 action 的分支/标签，Rust 版本要放到 `toolchain` 参数里。
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.1
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          # 工作区根在仓库根目录，共享 target/
          shared-key: tauri-${{ matrix.label }}

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri bundles
        run: pnpm tauri build
        env:
          CI: true

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xbxrc-bundles-${{ matrix.label }}
          if-no-files-found: error
          path: target/release/bundle/
