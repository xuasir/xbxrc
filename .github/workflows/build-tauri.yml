name: Build Tauri

on:
  workflow_dispatch:
  push:
    branches:
      - "release/**"

concurrency:
  group: build-tauri-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build-${{ matrix.label }}
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macos
            bundle: dmg
            artifact_glob: target/release/bundle/dmg/*.dmg
          - os: windows-latest
            label: windows
            bundle: nsis
            artifact_glob: target/release/bundle/nsis/*.exe

    runs-on: ${{ matrix.os }}
    env:
      CMAKE_ARGS: -DCMAKE_POLICY_VERSION_MINIMUM=3.5
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read app version
        id: version
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install opus pkg-config libx11 libxcb

      - name: Verify vendored FFmpeg SDK
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            test -d "src-tauri/resources/ffmpeg/windows-x64/include"
            test -d "src-tauri/resources/ffmpeg/windows-x64/lib"
            test -d "src-tauri/resources/ffmpeg/windows-x64/bin"
            test -f "src-tauri/resources/ffmpeg/windows-x64/bin/ffmpeg.exe"
          else
            if [[ "$(uname -m)" == "arm64" ]]; then
              test -d "src-tauri/resources/ffmpeg/macos-arm64/include"
              test -d "src-tauri/resources/ffmpeg/macos-arm64/lib"
            else
              test -d "src-tauri/resources/ffmpeg/macos-x64/include"
              test -d "src-tauri/resources/ffmpeg/macos-x64/lib"
            fi
          fi

      - name: Install LLVM (Windows, bindgen)
        if: runner.os == 'Windows'
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "18.1"

      - name: pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.1
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          shared-key: tauri-${{ matrix.label }}

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build Tauri bundle (${{ matrix.bundle }})
        run: pnpm tauri build --bundles ${{ matrix.bundle }}
        env:
          CI: true

      - name: Upload platform bundle
        uses: actions/upload-artifact@v4
        with:
          name: xbxrc-${{ matrix.label }}-${{ steps.version.outputs.value }}-${{ runner.arch }}
          if-no-files-found: error
          path: ${{ matrix.artifact_glob }}

  package:
    name: package-installers
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Download platform bundles
        uses: actions/download-artifact@v4
        with:
          pattern: xbxrc-*
          merge-multiple: true
          path: dist/installers

      - name: List installers
        run: find dist/installers -type f | sort

      - name: Upload combined installers
        uses: actions/upload-artifact@v4
        with:
          name: xbxrc-installers
          if-no-files-found: error
          path: dist/installers/**/*
          retention-days: 30
