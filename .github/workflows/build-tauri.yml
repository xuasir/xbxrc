name: Build Tauri

on:
  workflow_dispatch:
  push:
    branches:
      - "release/**"

concurrency:
  group: build-tauri-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build-${{ matrix.label }}
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macos
            bundle: dmg
          - os: windows-latest
            label: windows
            bundle: nsis

    runs-on: ${{ matrix.os }}
    env:
      CMAKE_ARGS: -DCMAKE_POLICY_VERSION_MINIMUM=3.5
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
      # CI 下关闭增量编译，便于 rust-cache 稳定命中 target/
      CARGO_INCREMENTAL: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Read app version
        id: version
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Verify native build prerequisites (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          # macos-latest 镜像已预装 pkgconf / cmake，无需 brew install。
          # 见 https://github.com/actions/runner-images/blob/main/images/macos/macos-15-Readme.md
          command -v cmake >/dev/null
          command -v pkg-config >/dev/null

      - name: Verify vendored FFmpeg SDK
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            test -d "src-tauri/resources/ffmpeg/windows-x64/include"
            test -d "src-tauri/resources/ffmpeg/windows-x64/lib"
            test -d "src-tauri/resources/ffmpeg/windows-x64/bin"
            test -f "src-tauri/resources/ffmpeg/windows-x64/bin/ffmpeg.exe"
          else
            if [[ "$(uname -m)" == "arm64" ]]; then
              test -d "src-tauri/resources/ffmpeg/macos-arm64/include"
              test -d "src-tauri/resources/ffmpeg/macos-arm64/lib"
            else
              test -d "src-tauri/resources/ffmpeg/macos-x64/include"
              test -d "src-tauri/resources/ffmpeg/macos-x64/lib"
            fi
          fi

      - name: Configure LIBCLANG_PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # windows-latest 已预装 LLVM，无需 choco 重装（可节省数分钟）
          $libclang = Join-Path $env:ProgramFiles 'LLVM\bin'
          if (-not (Test-Path (Join-Path $libclang 'libclang.dll'))) {
            throw "libclang.dll not found under $libclang"
          }
          "LIBCLANG_PATH=$libclang" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.1

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          shared-key: xbxrc-${{ matrix.label }}
          cache-all-crates: true
          cache-workspace-crates: true

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      - name: Build Tauri bundle (${{ matrix.bundle }})
        run: pnpm tauri build --bundles ${{ matrix.bundle }}
        env:
          CI: true

      - name: Stage installer
        id: installer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          version="${{ steps.version.outputs.value }}"
          label="${{ matrix.label }}"

          if [[ "$label" == "macos" ]]; then
            shopt -s nullglob
            bundles=(target/release/bundle/dmg/*.dmg)
            if [[ ${#bundles[@]} -eq 0 ]]; then
              echo "No DMG found under target/release/bundle/dmg/"
              exit 1
            fi
            file="dist/xbxrc-${version}-macos.dmg"
            cp "${bundles[0]}" "$file"
          else
            shopt -s nullglob
            bundles=(target/release/bundle/nsis/*.exe)
            if [[ ${#bundles[@]} -eq 0 ]]; then
              echo "No NSIS installer found under target/release/bundle/nsis/"
              exit 1
            fi
            file="dist/xbxrc-${version}-windows-setup.exe"
            cp "${bundles[0]}" "$file"
          fi

          echo "file=$file" >> "$GITHUB_OUTPUT"
          ls -lh "$file"

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: xbxrc-${{ matrix.label }}-${{ steps.version.outputs.value }}
          path: ${{ steps.installer.outputs.file }}
          compression-level: 0
          if-no-files-found: error
