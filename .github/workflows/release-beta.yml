name: Release Beta

on:
  push:
    branches:
      - release/test

concurrency:
  group: release-beta-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build-${{ matrix.label }}
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macos
            bundle: app,dmg
          - os: windows-latest
            label: windows
            bundle: nsis

    runs-on: ${{ matrix.os }}
    env:
      CMAKE_ARGS: -DCMAKE_POLICY_VERSION_MINIMUM=3.5
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
      CARGO_INCREMENTAL: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set beta version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          base="$(node -p "require('./package.json').version")"
          version="${base}-beta.${{ github.run_number }}"
          node <<EOF
          const fs = require('fs');
          const pkgPath = 'package.json';
          const tauriPath = 'src-tauri/tauri.conf.json';
          const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
          pkg.version = '${version}';
          fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + '\n');
          const tauri = JSON.parse(fs.readFileSync(tauriPath, 'utf8'));
          tauri.version = '${version}';
          fs.writeFileSync(tauriPath, JSON.stringify(tauri, null, 2) + '\n');
          EOF
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Verify native build prerequisites (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          command -v cmake >/dev/null
          command -v pkg-config >/dev/null

      - name: Verify vendored FFmpeg SDK
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            test -d "src-tauri/resources/ffmpeg/windows-x64/include"
            test -d "src-tauri/resources/ffmpeg/windows-x64/lib"
            test -d "src-tauri/resources/ffmpeg/windows-x64/bin"
            test -f "src-tauri/resources/ffmpeg/windows-x64/bin/ffmpeg.exe"
          else
            if [[ "$(uname -m)" == "arm64" ]]; then
              test -d "src-tauri/resources/ffmpeg/macos-arm64/include"
              test -d "src-tauri/resources/ffmpeg/macos-arm64/lib"
            else
              test -d "src-tauri/resources/ffmpeg/macos-x64/include"
              test -d "src-tauri/resources/ffmpeg/macos-x64/lib"
            fi
          fi

      - name: Configure LIBCLANG_PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $libclang = Join-Path $env:ProgramFiles 'LLVM\bin'
          if (-not (Test-Path (Join-Path $libclang 'libclang.dll'))) {
            throw "libclang.dll not found under $libclang"
          }
          "LIBCLANG_PATH=$libclang" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.1

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          shared-key: xbxrc-${{ matrix.label }}
          cache-all-crates: true
          cache-workspace-crates: true

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      - name: Build Tauri bundle (${{ matrix.bundle }})
        run: pnpm tauri build --bundles ${{ matrix.bundle }}
        env:
          CI: true
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Verify release bundle layout
        shell: bash
        run: node scripts/release-check-bundle.mjs "${{ matrix.label }}"

      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release-collect-assets.mjs "release-assets-${{ matrix.label }}" "${{ steps.version.outputs.value }}" "${{ matrix.label }}"

      - name: Upload release assets
        uses: actions/upload-artifact@v7
        with:
          name: release-assets-${{ matrix.label }}
          path: release-assets-${{ matrix.label }}/
          compression-level: 0
          if-no-files-found: error

  publish:
    name: publish-github-release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download build artifacts
        uses: actions/download-artifact@v6
        with:
          path: release-assets
          pattern: release-assets-*
          merge-multiple: false

      - name: Resolve beta version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./release-assets/release-assets-macos/manifest.json').version")"
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Build latest.json
        run: |
          node scripts/release-write-latest-json.mjs release-assets "${{ steps.version.outputs.value }}" \
            "https://github.com/xuasir/xbxrc/releases/download/beta"

      - name: Publish beta release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.value }}"
          upload_dir="upload"
          mkdir -p "$upload_dir"
          shopt -s nullglob
          for dir in release-assets/release-assets-*; do
            cp -a "$dir"/* "$upload_dir"/
          done
          cp release-assets/latest.json "$upload_dir/latest.json"

          if ! gh release view beta >/dev/null 2>&1; then
            gh release create beta \
              --prerelease \
              --title "xbxrc beta" \
              --notes "Rolling beta channel (release/test). Version ${version}. Do not delete this release."
          fi

          gh release upload beta "$upload_dir"/* --clobber
          echo "Published beta ${version} to https://github.com/xuasir/xbxrc/releases/tag/beta"
