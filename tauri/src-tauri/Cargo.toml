[package]
name = "xbxrc"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "xbxrc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
async-trait = "0.1"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13.2", features = ["json", "blocking"] }
p256 = { version = "0.13.2", features = ["jwk", "pkcs8", "std", "sha256"] }
ring = "0.17.14"
openssl = { version = "0.10.75", features = ["v110"] }
base64 = "0.22.1"
hmac = "0.12.1"
sha2 = "0.10.9"
hex-literal = "1.1.0"
rand_core = "0.10.0"
uuid = "1.22.0"
chrono = { version = "0.4.44", features = ["serde"] }
url = "2.5.8"
parking_lot = "0.12.5"
rand = "0.10.0"
tauri-plugin-shell = "2.3.5"
tauri-plugin-fs = "2.4.5"
tauri-plugin-store = "2.4.2"
tauri-plugin-keepawake = "0.1.1"
tokio = { version = "1.50.0", features = ["full"] }
xbxengine = { path = "../../crates/xbxengine/core" }
xbxengine-app = { path = "../../crates/xbxengine/app" }
xbxengine-protocol = { path = "../../crates/xbxengine/protocol" }
xbox-webapi = { path = "../../crates/xbox-webapi" }
ohmygamepad-host = { path = "../../crates/ohmygamepad/bridge/host" }
ohmygamepad-protocol = { path = "../../crates/ohmygamepad/protocol" }
thiserror = "2.0.18"
log = "0.4.29"
env_logger = "0.11.9"
