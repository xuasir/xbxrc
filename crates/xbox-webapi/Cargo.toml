[package]
name = "xbox-webapi"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
reqwest = { version = "0.13.2", features = [ "json" ] }
serde = { version = "1", features = [ "derive" ] }
serde_json = "1"
thiserror = "1.0"
chrono = { version = "0.4", features = [ "serde" ] }
base64 = "0.22"
p256 = { version = "0.13", features = [ "ecdsa" ] }
uuid = { version = "1.0", features = [
  "v4",
  "serde"
] }
rand = "0.9"
sha2 = "0.10"
openssl = "0.10"
tokio = { version = "1", features = [ "time" ] }
