[package]
name = "ohmygamepad-bridge-napi"
version = "0.1.0"

edition.workspace = true

rust-version.workspace = true

license.workspace = true

authors.workspace = true

publish = false

[dependencies]
napi = { version = "2.16.17", default-features = false, features = [ "napi6" ] }
napi-derive = "2.16.13"
ohmygamepad-core = { path = "../../core" }
ohmygamepad-protocol = { path = "../../protocol" }
ohmygamepad-gilrs = { path = "../../backends/gilrs" }
serde = { version = "1.0.228", features = [ "derive" ] }
serde_json = "1.0.145"

[build-dependencies]
napi-build = "2.1.6"

[lib]
path = "src/lib.rs"
crate-type = [
  "rlib",
  "cdylib"
]
