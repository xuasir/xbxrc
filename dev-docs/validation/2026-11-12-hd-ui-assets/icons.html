<!doctype html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>XBXRC 图标清晰度验证</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 36px; background: #111710; color: #edf6e9; font: 15px/1.5 system-ui, sans-serif; }
    body[data-theme='light'] { background: #edf3e9; color: #19231a; }
    h1 { margin: 0 0 24px; font-size: 24px; font-weight: 500; }
    h2 { margin: 28px 0 16px; font-size: 16px; font-weight: 500; }
    .app-icons, .nav-icons { display: flex; align-items: center; flex-wrap: wrap; gap: 24px; }
    figure { display: flex; align-items: center; flex-direction: column; gap: 10px; margin: 0; }
    figcaption { font-size: 12px; opacity: .75; }
    .nav-icon { display: block; background: currentColor; mask: var(--icon) center / contain no-repeat; }
    .app-icons img { object-fit: contain; }
    nav { display: flex; gap: 18px; margin-top: 28px; }
    a { color: inherit; }
    @media (max-width: 520px) { body { padding: 20px; } .app-icons, .nav-icons { gap: 18px; } }
  </style>
</head>
<body>
  <h1>原版应用图标与矢量界面图标</h1>
  <div class="app-icons" id="app-icons"></div>
  <h2>导航及串流 SVG · 32px / 64px</h2>
  <div class="nav-icons" id="nav-icons"></div>
  <nav><a href="?theme=dark">深色</a><a href="?theme=light">浅色</a><a href="./index.html#/xhome">返回首页</a></nav>
  <script type="module">
    document.body.dataset.theme = new URLSearchParams(location.search).get('theme') ?? 'dark'
    const variants = [
      ['原版 SVG', '/src-tauri/icons/icon-source.svg', 32],
      ['32px PNG / @2x', '/src-tauri/icons/32x32.png', 32, '/src-tauri/icons/64x64.png 2x'],
      ['64px PNG / @2x', '/src-tauri/icons/64x64.png', 64, '/src-tauri/icons/128x128.png 2x'],
      ['128px PNG / @2x', '/src-tauri/icons/128x128.png', 128, '/src-tauri/icons/128x128@2x.png 2x'],
      ['1024px master', '/src-tauri/icons/icon-source-1024.png', 224],
      ['原版 iOS', '/src-tauri/icons/ios/AppIcon-512@2x.png', 160],
    ]
    document.getElementById('app-icons').innerHTML = variants.map(([label, path, size, sources]) => `<figure><img src="${path}" ${sources ? `srcset="${sources}"` : ''} alt="${label}" width="${size}" height="${size}"><figcaption>${label}</figcaption></figure>`).join('')
    const names = ['xbox-logo', 'xhome', 'xcloud', 'ctrl', 'no-ctrl', 'my', 'setting', 'exit', 'stream-diagnostics']
    document.getElementById('nav-icons').innerHTML = names.map(name => {
      const path = `/src/assets/${name === 'stream-diagnostics' ? 'stream' : 'nav'}/${name}.svg`
      return `<figure><span class="nav-icon" role="img" aria-label="${name}" style="--icon:url('${path}');width:32px;height:32px"></span><span class="nav-icon" role="img" aria-label="${name} 64px" style="--icon:url('${path}');width:64px;height:64px"></span><figcaption>${name}</figcaption></figure>`
    }).join('')
  </script>
</body>
</html>
