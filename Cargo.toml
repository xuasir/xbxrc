[workspace]
members = [
  "crates/ohmygamepad/protocol",
  "crates/ohmygamepad/core",
  "crates/ohmygamepad/bridge/host",
  "crates/ohmygamepad/backends/sdl3",
  "crates/xbxengine/protocol",
  "crates/xbxengine/core",
  "crates/xbox-auth-flow",
  "crates/xbox-streaming",
  "crates/xbox-webapi",
  "src-tauri",
]
default-members = [ "src-tauri" ]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.93"
license = "MIT"
authors = [ "xuasir" ]

[workspace.dependencies]
serde = { version = "1", features = [ "derive" ] }
serde_json = "1"
tokio = { version = "1", features = [ "full" ] }
thiserror = "2"
log = "0.4"
reqwest = { version = "0.13.2", features = [
  "json",
  "blocking"
] }
rustls = { version = "0.23.37", default-features = false, features = [
  "std",
  "aws_lc_rs",
  "ring"
] }
chrono = { version = "0.4.44", features = [ "serde" ] }
uuid = "1.22.0"
base64 = "0.22.1"
rand = "0.10.0"
rand_core = "0.10.0"
url = "2.5.8"
parking_lot = "0.12.5"
bytes = "1.10.1"
cpal = "0.15.3"
opus = "0.3.0"
rtc = "0.9.0"
rtc-rtp = "0.9.0"
rtc-rtcp = "0.9.0"
rtc-media = "0.9.0"
rtc-shared = "0.9.0"
rtc-stun = "0.9.0"
rtc-turn = "0.9.0"
p256 = { version = "0.13.2", features = [
  "jwk",
  "pkcs8",
  "std",
  "sha256"
] }
ring = "0.17.14"
hmac = "0.12.1"
sha2 = "0.10.9"
hex-literal = "1.1.0"
async-trait = "0.1"
env_logger = "0.11.9"
h264-reader = "0.8.0"
ffmpeg-sys-next = "8.1.0"
rfd = "0.15.4"

[profile.dev]
# 开发期仅保留基础行号信息，减少调试产物体积。
debug = "line-tables-only"
# 关闭增量缓存，避免 target/debug/incremental 长期膨胀。
incremental = false
opt-level = 0

[profile.release]
opt-level = 3
# 真发版的编译-性能平衡：比 fat LTO + 单单元明显更快。
lto = "thin"
codegen-units = 8
strip = true
